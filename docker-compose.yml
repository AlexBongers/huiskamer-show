services:
  huiskamer-show:
    build: .
    container_name: huiskamer-show
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # Optioneel: stel vast LAN-adres of lokaal domein in voor de QR-code op TV
      # Laat leeg om automatisch window.location.origin van de TV te gebruiken
      - PUBLIC_URL=
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
